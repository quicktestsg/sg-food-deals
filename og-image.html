<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#0c0a09 0%,#1c1917 50%,#292524 100%);
font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
.wrap{text-align:center;padding:60px}
.emoji{font-size:80px;margin-bottom:20px}
h1{font-size:72px;font-weight:900;color:#fef3c7;letter-spacing:-0.03em;line-height:1.1;margin-bottom:16px}
h1 em{font-style:italic;font-weight:300;background:linear-gradient(135deg,#f59e0b 0%,#ef4444 50%,#84cc16 100%);
-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.tag{display:inline-block;padding:8px 20px;border-radius:100px;background:rgba(245,158,11,0.15);
border:1px solid rgba(245,158,11,0.3);font-size:18px;font-weight:600;color:#f59e0b;margin-bottom:32px}
.subtitle{font-size:28px;color:#a8a29e;font-weight:400;line-height:1.4}
.brands{margin-top:32px;font-size:22px;color:#78716c;font-weight:500}
</style></head><body>
<div class="wrap">
<div class="emoji">🍜</div>
<div class="tag">Updated Daily · Singapore 🇸🇬</div>
<h1>SG Food Deals<br><em>& Daily Steals</em></h1>
<p class="subtitle">1-for-1 dining · Freebies · Flash promos · Travel deals<br>All the 羊毛 worth your time</p>
<p class="brands">McDonald's · Starbucks · FairPrice · Scoot · KFC · Luckin Coffee</p>
</div>
</body></html>
